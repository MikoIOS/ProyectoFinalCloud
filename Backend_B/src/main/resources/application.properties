spring.application.name=Backend_B
server.port=${PORT:8080}

# ---------------------------------------------------------------- Base de datos
# Por defecto H2 en memoria (desarrollo). En produccion usar el perfil "prod" (PostgreSQL).
spring.datasource.url=jdbc:h2:mem:backend_b;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Inserciones por lotes (seeder y generacion de planillas)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------- Seguridad
# Mismo secreto HS256 con el que ms-usuarios firma los JWT (claims: tenant_id, user_id, rol, empleado_id)
hcm.jwt.secret=${JWT_SECRET:dev-secret-hcm-cambiar-en-produccion}
# POST /api/v1/dev/token para obtener tokens de prueba (desactivar en produccion)
hcm.dev.habilitado=${HCM_DEV:true}
hcm.cors.origenes=${CORS_ORIGENES:*}

# ---------------------------------------------------------------- Eventos
# Si se define, POST /api/v1/eventos exige la cabecera X-Api-Key con este valor
hcm.eventos.api-key=${EVENTOS_API_KEY:}
# Si se define, cada evento publicado (NominaGenerada, AusenciaSolicitada, ...) se envia por POST a esta URL
hcm.eventos.webhook-url=${EVENTOS_WEBHOOK_URL:}
hcm.eventos.webhook-api-key=${EVENTOS_WEBHOOK_API_KEY:}

# ---------------------------------------------------------------- Reglas de negocio
hcm.zona-horaria=America/Lima
hcm.nominas.tasa-pension=0.13
hcm.nominas.tasa-essalud=0.09
hcm.nominas.tamano-lote=200
hcm.asistencia.hora-ingreso=09:00
hcm.asistencia.tolerancia-minutos=10
hcm.asistencia.dias-vacaciones-anuales=30

# ---------------------------------------------------------------- Datos ficticios (DataSeeder)
# Solo se generan si la tabla de empleados esta vacia. Con 10000 por tenant se superan los 30,000 registros.
hcm.seed.habilitado=${HCM_SEED:true}
hcm.seed.tenants=andina,pacifico,sierra
hcm.seed.empleados-por-tenant=${HCM_SEED_EMPLEADOS:50}
hcm.seed.meses-planilla=2
hcm.seed.dias-marcacion=5
hcm.seed.ausencias-por-empleado=1

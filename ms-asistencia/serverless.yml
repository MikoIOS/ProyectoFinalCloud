service: ms-asistencia
frameworkVersion: "4"

custom:
  auth:
    arn: ${cf:ms-usuarios-${sls:stage}.AuthorizerArn}
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 300
  topicArn: ${cf:ms-usuarios-${sls:stage}.EventosTopicArn}

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 29
  iam:
    role: arn:aws:iam::851725431647:role/LabRole
  environment:
    TABLE_NAME: hcm-asistencia-${sls:stage}
    TABLE_EMPLEADOS: hcm-empleados
    TOPIC_ARN: ${self:custom.topicArn}

package:
  patterns:
    - '!tests/**'
    - '!scripts/**'
    - '!**/__pycache__/**'
    - '!.venv/**'

functions:
  ping:
    handler: src/handlers/http.ping
    events:
      - http: { path: ping, method: get, cors: true }
  marcar:
    handler: src/handlers/http.marcar
    events:
      - http: { path: marcaciones, method: post, cors: true, authorizer: '${self:custom.auth}' }
  marcaciones:
    handler: src/handlers/http.marcaciones
    events:
      - http: { path: marcaciones, method: get, cors: true, authorizer: '${self:custom.auth}' }
  solicitar:
    handler: src/handlers/http.solicitar
    events:
      - http: { path: ausencias, method: post, cors: true, authorizer: '${self:custom.auth}' }
  ausencias:
    handler: src/handlers/http.ausencias
    events:
      - http: { path: ausencias, method: get, cors: true, authorizer: '${self:custom.auth}' }
  pendientes:
    handler: src/handlers/http.pendientes
    events:
      - http: { path: ausencias/pendientes, method: get, cors: true, authorizer: '${self:custom.auth}' }
  ausencia:
    handler: src/handlers/http.ausencia
    events:
      - http: { path: 'ausencias/{ausencia_id}', method: get, cors: true, authorizer: '${self:custom.auth}' }
  resolver:
    handler: src/handlers/http.resolver
    events:
      - http: { path: 'ausencias/{ausencia_id}/estado', method: patch, cors: true, authorizer: '${self:custom.auth}' }
  saldo:
    handler: src/handlers/http.saldo
    events:
      - http: { path: 'ausencias/saldo/{empleado_id}', method: get, cors: true, authorizer: '${self:custom.auth}' }
  resumen:
    handler: src/handlers/http.resumen
    events:
      - http: { path: asistencia/resumen, method: get, cors: true, authorizer: '${self:custom.auth}' }
  reporte:
    handler: src/handlers/http.reporte
    events:
      - http: { path: asistencia/reportes, method: get, cors: true, authorizer: '${self:custom.auth}' }
  publicarEventos:
    handler: src/handlers/eventos.handler
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt AsistenciaTable.StreamArn
          startingPosition: TRIM_HORIZON
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName: [INSERT, MODIFY]
              dynamodb:
                NewImage:
                  clase:
                    S: [AUS]
  calendario:
    handler: src/handlers/calendario.handler
    timeout: 300
    events:
      - schedule: cron(5 5 * * ? *)

resources:
  Resources:
    AsistenciaTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: hcm-asistencia-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    GatewayResponse4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
    GatewayResponse5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
  Outputs:
    AsistenciaTableName:
      Value: !Ref AsistenciaTable
    ApiUrl:
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'

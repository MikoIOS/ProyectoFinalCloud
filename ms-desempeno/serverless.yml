service: ms-desempeno
frameworkVersion: '^4.0.0'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    TABLE_NAME: hcm-desempeno-${sls:stage}
    # Topic único hcm-eventos (creado y exportado por ms-usuarios)
    EVENTS_TOPIC_ARN: ${cf:ms-usuarios-${sls:stage}.EventosTopicArn}
  iam:
    role: arn:aws:iam::851725431647:role/LabRole

custom:
  auth:
    arn: ${cf:ms-usuarios-${sls:stage}.AuthorizerArn}
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 300

functions:
  crearEvaluacion:
    handler: handlers/evaluaciones.crear
    events:
      - http: { path: evaluaciones, method: post, cors: true, authorizer: "${self:custom.auth}" }
  listarEvaluaciones:
    handler: handlers/evaluaciones.listar
    events:
      - http: { path: evaluaciones, method: get, cors: true, authorizer: "${self:custom.auth}" }
  actualizarEvaluacion:
    handler: handlers/evaluaciones.actualizar
    events:
      - http: { path: "evaluaciones/{evaluacion_id}", method: put, cors: true, authorizer: "${self:custom.auth}" }

  crearReconocimiento:
    handler: handlers/reconocimientos.crear
    events:
      - http: { path: reconocimientos, method: post, cors: true, authorizer: "${self:custom.auth}" }

resources:
  Resources:
    DesempenoTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: hcm-desempeno-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: empleado_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: empleado-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: empleado_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # CORS también en los errores del Authorizer/API Gateway (frontend en Amplify)
    GatewayResponse4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
    GatewayResponse5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
